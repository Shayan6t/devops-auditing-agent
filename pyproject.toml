[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "devops-auditing-agent"
version = "1.0.0"
description = "Autonomous AI Agent for DevOps Repository Auditing and Best-Practice Inspection"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "DevOps Engineering Student" }
]
dependencies = [
    "google-genai>=2.0.0",
    "openai>=1.40.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
